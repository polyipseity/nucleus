$schema: ../../config.schema.json
# Nucleus Hermes gateway profile. The provider, toolset, and approval policy
# match the CLI profile; only the terminal backend changes.
direct_provider_pool:
  - env: AI_GATEWAY_API_KEY
    skip_when_empty: true
  - env: ANTHROPIC_API_KEY
    skip_when_empty: true
  - env: OPENAI_API_KEY
    skip_when_empty: true
  - env: OPENAI_BASE_URL
    skip_when_empty: true
  - env: NOUS_API_KEY
    skip_when_empty: true
  - env: HF_TOKEN
    skip_when_empty: true
  - env: GITHUB_TOKEN
    skip_when_empty: true
  - env: OPENROUTER_API_KEY
    skip_when_empty: true

model:
  provider: auto

# Policy areas: web, terminal/files, browser, media, orchestration, memory,
# automation, MCP, and plugins. Hermes names several of these differently.
# MCP and plugin tools register themselves once their servers/plugins load.
toolsets:
  - web
  - terminal
  - file
  - browser
  - vision
  - image_gen
  - tts
  - delegation
  - kanban
  - memory
  - cronjob
  - skills

terminal:
  backend: docker
  # Activation links the live checkout at $HERMES_HOME/repo, so container
  # writes land in the tracked tree instead of a Nix store snapshot.
  docker_volumes:
    - "${HERMES_HOME}/repo:/workspace/nucleus"
  docker_forward_env: []
  docker_run_as_host_user: true

approvals:
  mode: smart

plugins:
  enabled:
    - harness-bridge

# The free alias goes first. A request that exhausts it falls through to the
# paid alias on the same LiteLLM endpoint.
fallback_providers:
  - provider: custom:litellm
    model: default-free
  - provider: custom:litellm
    model: default

custom_providers:
  - name: litellm
    api_key: sk-nucleus-dummy-litellm
    base_url: http://127.0.0.1:4000/v1
    models:
      default:
        maxInputTokens: 256000
        maxOutputTokens: 16000
      default-free:
        maxInputTokens: 256000
        maxOutputTokens: 16000

# WHY: Telegram and Discord pair unknown users instead of trusting ambient
# identity. The allowlists stay empty here and are filled in a user overlay.
gateway:
  unauthorized_dm_behavior: pair

platforms:
  telegram:
    enabled: true
    allow_from: []
    group_allow_from: []
    group_allowed_chats: []
    extra:
      unauthorized_dm_behavior: pair
  discord:
    enabled: true
    extra:
      allow_from: []
      allowed_roles: []
      allowed_channels: []
      require_mention: true
      # WHY: exec approval buttons stay admin-only; with no admins configured
      # they fail closed until a user overlay names them.
      require_admin_for_exec_approval: true
      allow_admin_from: []
  # WHY: ntfy has no native user identity. A private topic plus its read token
  # is the trust boundary, so neither value is stored in the repo.
  ntfy:
    enabled: true
    allow_from: []
    extra:
      markdown: true
