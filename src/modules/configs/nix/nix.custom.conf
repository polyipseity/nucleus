auto-optimise-store = true
builders = @/etc/nix/machines
builders-use-substitutes = true
eval-cores = 0
extra-platforms = x86_64-darwin aarch64-darwin
# Binary caches for maximum aarch64-darwin coverage. Ordered by reliability:
# cache.nixos.org (Hydra CI), Determinate (mirrors Hydra + their packages),
# FlakeHub (mirrors Hydra + flake-specific), nix-community Cachix (spotty darwin),
# devenv Cachix (limited darwin). Trusted-public-keys must list every
# substituter's signing key so Nix accepts signed .narinfo responses.
extra-substituters = https://nix-community.cachix.org https://devenv.cachix.org
extra-trusted-substituters = https://cache.nixos.org https://cache.flakehub.com https://install.determinate.systems https://nix-community.cachix.org https://devenv.cachix.org
extra-trusted-public-keys = cache.flakehub.com-3:hJuILl5sVK4iKm86JzgdXW12Y2Hwd5G07qKtHTOcDCM= cache.flakehub.com-4:Asi8qIv291s0aYLyH6IOnr5Kf6+OF14WVjkE6t3xMio= cache.flakehub.com-5:zB96CRlL7tiPtzA9/WKyPkp3A2vqxqgdgyTVNGShPDU= cache.flakehub.com-6:W4EGFwAGgBj3he7c5fNh9NkOXw0PUVaxygCVKeuvaqU= cache.flakehub.com-7:mvxJ2DZVHn/kRxlIaxYNMuDG1OvMckZu32um1TadOR8= cache.flakehub.com-8:moO+OVS0mnTjBTcOUh2kYLQEd59ExzyoW1QgQ8XAARQ= cache.flakehub.com-9:wChaSeTI6TeCuV/Sg2513ZIM9i0qJaYsF+lZCXg0J6o= cache.flakehub.com-10:2GqeNlIp6AKp4EF2MVbE1kBOp9iBSyo0UPR9KoR0o1Y= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= devenv.cachix.org-1:w1cLUi8dv3hnoSPGAHZ8FecMWcJwQpLBTjfGkCRntFY=
keep-derivations = true
keep-outputs = true
lazy-trees = true
max-free = 64000000000
min-free = 16000000000
# Fallback for standalone nix commands (e.g. manual nix build/eval).
# The apply fix uses apply.sh's explicit NIX_PATH env var prepended
# to each nix invocation because darwin-rebuild overrides file-based
# config by clearing NIX_PATH to its default empty value.
nix-path = nixpkgs=flake:nixpkgs
trusted-users = root __USERNAME__
