# Starship configuration — managed by nucleus (src/modules/configs/starship.toml)
# See <https://starship.rs/config/> for all options.

# Four-line prompt: host → directory → git / environment →
# languages → system status → shell level → character.
# Colors use named ANSI colors for portability across light/dark themes.
format = """
$hostname\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_status\
$fill\
$container\
$direnv\
$docker_context\
$nix_shell\
$line_break\
$package\
$bun\
$c\
$cmake\
$dotnet\
$nodejs\
$python\
$rust\
$typst\
$line_break\
$battery\
$memory_usage\
$fill\
$cmd_duration\
$jobs\
$shell\
$status\
$sudo\
$time\
$line_break\
$shlvl\
$character\
"""

[hostname]
disabled = false
format = '[$ssh_symbol$hostname]($style) '
style = "bold green"

[directory]
format = '[$path]($style)[$read_only]($read_only_style) '
style = "bold blue"

[git_branch]
format = '[$symbol$branch(:$remote_branch)]($style) '

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bold yellow"

[git_status]
format = '[$all_status$ahead_behind]($style)'
style = "bold purple"

[container]
format = '[$symbol\[$name\]]($style) '
style = "bold red"

[direnv]
disabled = false
format = '[$symbol$loaded$allowed]($style) '
style = "bold yellow"
symbol = "⇋ "
allowed_msg = "a"
denied_msg = "d"
not_allowed_msg = "?"
loaded_msg = "✅ "
unloaded_msg = "❌ "

[docker_context]
format = '[$symbol$context]($style) '
style = "bold cyan"

[nix_shell]
format = '[$symbol$state($name)]($style) '
style = "bold yellow"
impure_msg = "⚠️ "
pure_msg = ""

[package]
format = '[$symbol$version]($style) '
style = "bold yellow"

[bun]
format = '[$symbol($version )]($style)'

[c]
format = '[$symbol($version(-$name) )]($style)'
style = "bold blue"

[cmake]
format = '[$symbol($version )]($style)'
style = "bold yellow"

[dotnet]
format = '[$symbol($version )(🎯 $tfm )]($style)'
style = "bold purple"

[nodejs]
format = '[$symbol($version )]($style)'

[python]
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'
style = "bold yellow"

[rust]
format = '[$symbol($version )]($style)'

[typst]
format = '[$symbol($version )]($style)'
style = "bold cyan"

[fill]
symbol = "·"
style = "bold black"

[battery]
format = '[$symbol$percentage]($style) '
full_symbol = "🔋 "
charging_symbol = "⚡️ "
discharging_symbol = "🪫 "
empty_symbol = "💀 "
unknown_symbol = "❓ "

[[battery.display]]
threshold = 100
style = "bold yellow"

[memory_usage]
disabled = false
format = '[$symbol${ram}(|${swap})]($style) '
style = "bold black"

[cmd_duration]
min_time = 0
format = '[⏱️ $duration]($style) '
style = "bold cyan"

[jobs]
style = "bold black"

[shell]
disabled = false
format = '[$indicator]($style) '

[status]
disabled = false
format = '[$symbol$status]($style) '

[sudo]
disabled = false
format = '[$symbol]($style)'
style = "bold yellow"

[time]
disabled = false
format = '[$time]($style) '
time_format = "%R"
style = "bold black"

[shlvl]
disabled = false
format = '[$symbol]($style)'
repeat = true
symbol = "❯"
repeat_offset = 1

[character]
success_symbol = '[❯](bold green)'
error_symbol = '[❯](bold red)'
