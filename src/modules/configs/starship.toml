# Starship configuration — managed by nucleus (src/modules/configs/starship.toml)
# See https://starship.rs/config/ for all options.

# Informative two-line prompt: directory, git, nix shell, language runtimes,
# right-aligned time, command duration, exit code, and memory usage.
# Uses Nerd Font glyphs (CaskaydiaCove Nerd Font).
format = """
$directory\
$git_branch\
$git_status\
$nix_shell\
$fill\
$time\
$cmd_duration\
$status\
$memory_usage\
$line_break\
$character\
"""

[character]
success_symbol = '[❯](bold green)'
error_symbol = '[❯](bold red)'

[directory]
truncation_length = 3

[git_branch]
format = "[$symbol$branch]($style)"
style = "bold purple"

[git_status]
style = "bold purple"

[nix_shell]
format = 'via [ $state( \($name\))]($style)'
impure_msg = "impure"
pure_msg = "pure"
style = "bold yellow"

[fill]
symbol = "·"
style = "dimmed white"

[time]
disabled = false
time_format = "%R"
style = "dimmed white"

[cmd_duration]
min_time = 0
format = "⏱️ [$duration]($style)"

[status]
disabled = false
format = "[✖ $status]($style)"
style = "bold red"
recognize_signal_code = true

[memory_usage]
disabled = false
threshold = 90
symbol = "🐏"
style = "bold dimmed white"

[shell]
disabled = false

[container]
format = '[⬢ \[$name\]]($style) '
style = "bold red dimmed"

[package]
format = 'is [📦 $version]($style)'
style = "bold 208"

[rust]
format = 'via [🦀 $version]($style)'
style = "bold red"

[bun]
format = 'via [🥟 $version]($style)'
style = "bold red"

[nodejs]
format = 'via [ $version]($style)'
style = "bold green"

[python]
format = 'via [🐍 $version]($style)'
style = "yellow bold"

[typst]
format = 'via [t $version]($style)'
style = "bold #0093A7"

[git_commit]
format = '[\($hash$tag\)]($style) '
style = "bold green"

[git_state]
format = '[\($state( $progress_current/$progress_total)\)]($style) '
style = "bold yellow"
