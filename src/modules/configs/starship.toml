# Starship configuration — managed by nucleus (src/modules/configs/starship.toml)
# See <https://starship.rs/config/> for all options.

# Three-line prompt: host → directory → git / environment → languages /
# right-aligned status → character.
# Uses Nerd Font glyphs (CaskaydiaCove Nerd Font).
# Colors use named ANSI colors for portability across light/dark themes.
format = """
$hostname\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_status\
$fill\
$line_break\
$container\
$direnv\
$docker_context\
$nix_shell\
$bun\
$c\
$cmake\
$dotnet\
$nodejs\
$package\
$python\
$rust\
$typst\
$line_break\
$fill\
$battery\
$cmd_duration\
$jobs\
$memory_usage\
$shell\
$shlvl\
$status\
$sudo\
$time\
$line_break\
$character\
"""

[character]
success_symbol = '[❯](bold green)'
error_symbol = '[❯](bold red)'

[hostname]
disabled = false
format = '[$ssh_symbol$hostname]($style) '
style = "bold green"

[directory]
format = '[$path]($style)[$read_only]($read_only_style) '
style = "bold blue"

[git_branch]
format = '[$symbol$branch(:$remote_branch)]($style) '

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bold yellow"

[git_status]
format = '[$all_status$ahead_behind]($style)'
style = "bold purple"

[container]
format = '[$symbol\[$name\]]($style) '
style = "bold red"

[direnv]
disabled = false
format = '[$symbol$loaded/$allowed]($style) '
style = "bold yellow"

[docker_context]
format = '[$symbol$context]($style) '
style = "bold cyan"

[nix_shell]
format = '[$symbol$state( \($name\))]($style) '
style = "bold yellow"

[bun]
format = '[$symbol($version )]($style)'

[c]
format = '[$symbol($version(-$name) )]($style)'
style = "bold blue"

[cmake]
format = '[$symbol($version )]($style)'
style = "bold yellow"

[dotnet]
format = '[$symbol($version )(🎯 $tfm )]($style)'
style = "bold purple"

[nodejs]
format = '[$symbol($version )]($style)'

[package]
format = '[$symbol$version]($style) '
style = "bold yellow"

[python]
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'
style = "bold yellow"

[rust]
format = '[$symbol($version )]($style)'

[typst]
format = '[$symbol($version )]($style)'
style = "bold cyan"

[fill]
symbol = "·"
style = "bold black"

[battery]
format = '[$symbol$percentage]($style) '

[cmd_duration]
min_time = 0
format = '[⏱️ $duration]($style) '
style = "bold cyan"

[jobs]
style = "bold black"

[memory_usage]
disabled = false
threshold = 90
format = '[$symbol${ram}(|${swap})]($style) '
style = "bold black"

[shell]
disabled = false
format = '[$indicator]($style) '

[shlvl]
format = '[$symbol$shlvl]($style) '
style = "bold black"

[status]
disabled = false
format = '[$symbol$status]($style) '

[sudo]
disabled = false
format = '[$symbol]($style)'
style = "bold yellow"

[time]
disabled = false
format = '[$time]($style) '
time_format = "%R"
style = "bold black"
