---
# LiteLLM proxy configuration, shared across all hosts. Gateway on 127.0.0.1:4000.
# Every request routes through the single generic `default` model; the order
# tiers on its deployments are the failover order. API keys come from SOPS secrets.
#
# Routing: simple-shuffle picks an endpoint within an order tier, and
# enable_weighted_failover re-picks from the healthy endpoints in that same tier on
# a retryable failure before falling through to the next tier. See router_settings.
#
# Redis carries utilization tracking, cooldown state, prompt-cache affinity and
# response caching. REDIS_HOST/REDIS_PORT/REDIS_USERNAME are non-secret vars from
# env-secrets.nix; REDIS_PASSWORD and REDIS_USER_LITELLM_PASSWORD are SOPS secrets
# through the KEYFILE:ENVVAR pipeline.
#
# Each api_key below is an environment variable (e.g. os.environ/KEY_AI_OPENCODE_ZEN)
# that the daemon scripts export before litellm starts. On POSIX litellm-daemon.sh
# takes KEYFILE:ENVVAR args from the ai.nix service and exports each pair it finds;
# sops-nix decrypts src/secrets/system.yml to /run/secrets/key_* at boot. On Windows
# LiteLLM-run.ps1 reads every env_key_* file and uppercases the name
# (env_key_ai_foo → KEY_AI_FOO).
#
# To add a provider: add the SOPS key to system.yml (env_key_<name>), add a
# model_list entry here, and map it in src/modules/lib/env-secrets.nix. The env var
# name is the full key name uppercased.

litellm_settings:
  # Drop unsupported client params (e.g. max_tokens) per-endpoint.
  drop_params: true
  cache: true
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
    password: os.environ/REDIS_USER_LITELLM_PASSWORD
    username: os.environ/REDIS_USERNAME
    # Namespace prefix, so other services on the same Redis do not collide.
    namespace: "litellm"
  # Register the Cline custom handler; cline_handler.py must sit next to this file.
  custom_provider_map:
    - provider: cline
      custom_handler: cline_handler.cline_handler

general_settings:
  environment_variables:
    # WARNING drops per-request INFO chatter while keeping errors and startup diagnostics.
    LITELLM_LOG: WARNING

router_settings:
  enable_health_check_routing: true
  # Mandatory for `order` prioritization.
  enable_pre_call_checks: true
  # Intra-tier failover: on a retryable failure, exclude the failed deployment and
  # re-pick from the remaining deployments in the same order tier before falling
  # through. Only works with `simple-shuffle` and async entrypoints.
  enable_weighted_failover: true
  # Prompt-cache stickiness: a request whose context prefix is already cached goes to
  # the endpoint holding that warm entry, bypassing load balancing.
  optional_pre_call_checks:
    - prompt_caching
  routing_strategy: simple-shuffle
  num_retries: 10
  retry_after: 5
  allowed_fails: 2
  cooldown_time: 300
  timeout: 30

model_list:

  # - model_name: ollama_chat/devstral-small-2:24b
  #   litellm_params:
  #     model: ollama_chat/devstral-small-2:24b
  #     api_base: http://127.0.0.1:11434
  #     model_info:
  #       max_input_tokens: 32000
  #       max_output_tokens: 16000

  # - model_name: ollama_chat/qwen2.5:1.5b
  #   litellm_params:
  #     model: ollama_chat/qwen2.5:1.5b
  #     api_base: http://127.0.0.1:11434
  #     model_info:
  #       max_input_tokens: 32000
  #       max_output_tokens: 16000

  # - model_name: ollama_chat/qwen3:8b
  #   litellm_params:
  #     model: ollama_chat/qwen3:8b
  #     api_base: http://127.0.0.1:11434
  #     model_info:
  #       max_input_tokens: 32000
  #       max_output_tokens: 16000

  # Order is the failover tier: the lowest order that is healthy serves the request.

  - model_name: default
    litellm_params:
      model: openai/mimo-v2.5-free
      api_base: https://opencode.ai/zen/v1
      api_key: os.environ/KEY_AI_OPENCODE_ZEN
      order: 1
      reasoning_effort: high
      model_info:
        max_input_tokens: 256000
        max_output_tokens: 16000

  - model_name: default
    litellm_params:
      model: cline/cline-pass/mimo-v2.5
      api_base: https://api.cline.bot/api/v1
      api_key: os.environ/KEY_AI_CLINE
      order: 2
      reasoning_effort: high
      model_info:
        max_input_tokens: 256000
        max_output_tokens: 16000
    model_info:
      health_check_max_tokens: 500

  - model_name: default
    litellm_params:
      model: openai/deepseek/deepseek-v4-flash
      api_base: https://api.commandcode.ai/provider/v1
      api_key: os.environ/KEY_AI_COMMAND_CODE
      order: 2
      reasoning_effort: high
      model_info:
        max_input_tokens: 256000
        max_output_tokens: 16000
    # CommandCode reports credit exhaustion as HTTP 400, which litellm never cools down.
    # WHY: litellm reads allowed_fails_policy only from the deployment's own model_info
    # (cooldown_handlers._get_deployment_cooldown_policy); under litellm_params it is inert.
    model_info:
      allowed_fails_policy:
        BadRequestErrorAllowedFails: 0

  - model_name: default
    litellm_params:
      model: openai/mimo-v2.5
      api_base: https://opencode.ai/zen/go/v1
      api_key: os.environ/KEY_AI_OPENCODE_GO
      order: 2
      reasoning_effort: high
      model_info:
        max_input_tokens: 256000
        max_output_tokens: 16000

  - model_name: default
    litellm_params:
      model: openrouter/xiaomi/mimo-v2.5
      api_key: os.environ/KEY_AI_OPENROUTER
      order: 3
      reasoning_effort: high
      model_info:
        max_input_tokens: 256000
        max_output_tokens: 16000
