# LiteLLM proxy configuration — shared across all hosts.
#
# AI gateway on 127.0.0.1:4000 routing to:
#   - Local Ollama daemon (127.0.0.1:11434) for offline models
#   - DeepSeek V4 via OpenCode Go (primary, order: 1) with
#     OpenRouter fallback (order: 2).  API keys from SOPS secrets.

litellm_settings:
  # Drop unsupported client params (e.g. max_tokens) per-endpoint.
  drop_params: true
  # Force IPv4 for all LLM API requests: local_addr=("0.0.0.0", 0) binds
  # outgoing sockets to IPv4, avoiding IPv6 EHOSTUNREACH on networks with
  # broken IPv6 routing.  This is a LiteLLM-level switch that affects the
  # TCPConnector used by aiohttp for all outbound LLM model connections.
  force_ipv4: true

# WARNING suppresses per-request INFO chatter while still capturing
# errors, warnings, and startup diagnostics.
general_settings:
  environment_variables:
    LITELLM_LOG: WARNING

# enable_pre_call_checks=true is required for the `order` field
# (primary/fallback tier selection) to be respected.  simple-shuffle
# randomizes endpoint selection within a tier.  The cooldown combo
# (allowed_fails/cooldown_time) benches a deployment after 3 failures
# for 60 s, with 5 s between retries.
router_settings:
  enable_pre_call_checks: true
  num_retries: 3
  retry_after: 5
  allowed_fails: 3
  cooldown_time: 60
  routing_strategy: simple-shuffle

model_list:
  # ---- Ollama models ----
  - model_name: ollama_chat/devstral-small-2:24b
    litellm_params:
      model: ollama_chat/devstral-small-2:24b
      api_base: http://127.0.0.1:11434

  - model_name: ollama_chat/magistral:24b
    litellm_params:
      model: ollama_chat/magistral:24b
      api_base: http://127.0.0.1:11434

  - model_name: ollama_chat/qwen2.5:1.5b
    litellm_params:
      model: ollama_chat/qwen2.5:1.5b
      api_base: http://127.0.0.1:11434

  - model_name: ollama_chat/qwen3:8b
    litellm_params:
      model: ollama_chat/qwen3:8b
      api_base: http://127.0.0.1:11434

  # ---- DeepSeek V4 models with fallback chain ----
  # Primary: OpenCode Go (order: 1), Fallback: OpenRouter (order: 2).
  # Both V4 Flash and V4 Pro support reasoning.effort = high | xhigh
  # (xhigh maps to max reasoning).  Each effort level gets a separate model
  # entry so clients can select the desired effort level by model name.
  #
  # Base variant (no reasoning param — lets the client decide).
  - model_name: deepseek/deepseek-v4-flash
    litellm_params:
      model: openai/deepseek-v4-flash
      api_base: https://opencode.ai/zen/go/v1
      api_key: os.environ/OPENCODE_GO_API_KEY
      order: 1
      model_info:
        max_input_tokens: 81920
  - model_name: deepseek/deepseek-v4-flash
    litellm_params:
      model: openrouter/deepseek/deepseek-v4-flash
      api_key: os.environ/OPENROUTER_API_KEY
      order: 2
      model_info:
        max_input_tokens: 81920

  - model_name: deepseek/deepseek-v4-flash/reasoning_high
    litellm_params:
      model: openai/deepseek-v4-flash
      api_base: https://opencode.ai/zen/go/v1
      api_key: os.environ/OPENCODE_GO_API_KEY
      order: 1
      reasoning:
        effort: high
      model_info:
        max_input_tokens: 81920
  - model_name: deepseek/deepseek-v4-flash/reasoning_high
    litellm_params:
      model: openrouter/deepseek/deepseek-v4-flash
      api_key: os.environ/OPENROUTER_API_KEY
      order: 2
      reasoning:
        effort: high
      model_info:
        max_input_tokens: 81920

  - model_name: deepseek/deepseek-v4-flash/reasoning_xhigh
    litellm_params:
      model: openai/deepseek-v4-flash
      api_base: https://opencode.ai/zen/go/v1
      api_key: os.environ/OPENCODE_GO_API_KEY
      order: 1
      reasoning:
        effort: xhigh
      model_info:
        max_input_tokens: 81920
  - model_name: deepseek/deepseek-v4-flash/reasoning_xhigh
    litellm_params:
      model: openrouter/deepseek/deepseek-v4-flash
      api_key: os.environ/OPENROUTER_API_KEY
      order: 2
      reasoning:
        effort: xhigh
      model_info:
        max_input_tokens: 81920

  - model_name: deepseek/deepseek-v4-pro
    litellm_params:
      model: openai/deepseek-v4-pro
      api_base: https://opencode.ai/zen/go/v1
      api_key: os.environ/OPENCODE_GO_API_KEY
      order: 1
      model_info:
        max_input_tokens: 81920
  - model_name: deepseek/deepseek-v4-pro
    litellm_params:
      model: openrouter/deepseek/deepseek-v4-pro
      api_key: os.environ/OPENROUTER_API_KEY
      order: 2
      model_info:
        max_input_tokens: 81920

  - model_name: deepseek/deepseek-v4-pro/reasoning_high
    litellm_params:
      model: openai/deepseek-v4-pro
      api_base: https://opencode.ai/zen/go/v1
      api_key: os.environ/OPENCODE_GO_API_KEY
      order: 1
      reasoning:
        effort: high
      model_info:
        max_input_tokens: 81920
  - model_name: deepseek/deepseek-v4-pro/reasoning_high
    litellm_params:
      model: openrouter/deepseek/deepseek-v4-pro
      api_key: os.environ/OPENROUTER_API_KEY
      order: 2
      reasoning:
        effort: high
      model_info:
        max_input_tokens: 81920

  - model_name: deepseek/deepseek-v4-pro/reasoning_xhigh
    litellm_params:
