---
# LiteLLM proxy configuration — shared across all hosts.
#
# AI gateway on 127.0.0.1:4000 routing to:
#   - Local Ollama daemon (127.0.0.1:11434) for offline models
#   - A single generic `default` model backed by remote providers, using
#     usage-based routing v2 with order-based failover.  API keys from
#     SOPS secrets.
#
# Routing: usage-based-routing-v2 selects the endpoint with the lowest
# utilization ratio relative to its tpm/rpm ceiling within each order
# tier.  On failure, the v2 cooldown mechanism excludes the failed
# endpoint and re-picks from remaining healthy ones.  After exhausting
# retries within a tier, the next order tier is tried (tier 1 → 2 → 3).
#
# Redis: required for utilization tracking, cooldown state, prompt-cache
# affinity, and response caching.  REDIS_HOST/REDIS_PORT are non-secret
# env vars from the env-catalog.nix registry.  REDIS_PASSWORD is a SOPS
# secret via the KEYFILE:ENVVAR pipeline.
#
# Env var lifecycle
# ────────────────
# Each api_key entry below references an environment variable (e.g.
# os.environ/KEY_AI_OPENCODE_ZEN_1).  These env vars are populated at
# runtime by the platform-specific daemon scripts before litellm starts:
#
#   POSIX (NixOS/macOS):
#     litellm-daemon.sh receives KEYFILE:ENVVAR positional args from
#     the systemd/launchd service (ai.nix).  For each pair, if KEYFILE
#     exists, the script reads its contents and exports the env var.
#     Key files come from sops-nix, which decrypts src/secrets/system.yml
#     to /run/secrets/key_* at boot.
#
#   Windows:
#     LiteLLM-run.ps1 reads all env_key_* files from the SOPS secrets
#     directory, strips the env_ prefix, and uppercases each name
#     (env_key_ai_foo → KEY_AI_FOO).
#
# To add a new provider: add the SOPS key to system.yml (env_key_<name>),
# add a model_list entry here, and add the mapping to src/modules/env-catalog.nix.
# The env var name is derived automatically by uppercasing the full key name.

litellm_settings:
  # Drop unsupported client params (e.g. max_tokens) per-endpoint.
  drop_params: true
  # Redis-backed response cache.  Also required for prompt-cache affinity
  # and usage-based routing state coordination.
  cache: true
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
    password: os.environ/REDIS_PASSWORD
    # Namespace prefix for all LiteLLM Redis keys.  Prevents collisions
    # with other services sharing the same Redis instance.
    namespace: "litellm"

# WARNING suppresses per-request INFO chatter while still capturing
# errors, warnings, and startup diagnostics.
general_settings:
  environment_variables:
    LITELLM_LOG: WARNING

router_settings:
  # Pre-flight checks: cooldown status, context limits, prompt-cache
  # affinity.  Mandatory for `order` prioritization.
  enable_pre_call_checks: true
  # Prompt-cache stickiness: routes requests with cached context
  # prefixes to the endpoint that holds the warm cache entry,
  # bypassing load balancing.
  optional_pre_call_checks:
    - prompt_caching
  # Selects the endpoint with the lowest utilization ratio relative
  # to its tpm/rpm ceiling within each order tier.
  routing_strategy: usage-based-routing-v2
  # Redis — shared state for utilization tracking, cooldowns, and
  # prompt-cache affinity mappings.
  redis_host: os.environ/REDIS_HOST
  redis_port: os.environ/REDIS_PORT
  redis_password: os.environ/REDIS_PASSWORD
  # Request-level retry budget across all order tiers.
  num_retries: 3
  # Minimum delay (seconds) between retry attempts.
  retry_after: 2
  # Failures per endpoint before temporary cooldown.
  allowed_fails: 2
  # Cooldown duration (seconds).
  cooldown_time: 300
  # Per-request HTTP timeout (seconds).
  timeout: 30

model_list:
  # ---- Ollama models ----
  - model_name: ollama_chat/devstral-small-2:24b
    litellm_params:
      model: ollama_chat/devstral-small-2:24b
      api_base: http://127.0.0.1:11434
      model_info:
        max_input_tokens: 32768
        max_output_tokens: 16384

  - model_name: ollama_chat/qwen2.5:1.5b
    litellm_params:
      model: ollama_chat/qwen2.5:1.5b
      api_base: http://127.0.0.1:11434
      model_info:
        max_input_tokens: 32768
        max_output_tokens: 16384

  - model_name: ollama_chat/qwen3:8b
    litellm_params:
      model: ollama_chat/qwen3:8b
      api_base: http://127.0.0.1:11434
      model_info:
        max_input_tokens: 32768
        max_output_tokens: 16384

  # ---- Default model (generic, remote-backed) ----
  # Usage-based routing v2: picks the endpoint with lowest utilization
  # within each order tier.  Order provides failover: tier 1 → 2 → 3.
  # tpm/rpm ceilings drive the utilization ratio.

  - model_name: default
    litellm_params:
      model: openai/mimo-v2.5-free
      api_base: https://opencode.ai/zen/v1
      api_key: os.environ/KEY_AI_OPENCODE_ZEN_1
      order: 1
      tpm: 128000
      rpm: 30
      reasoning_effort: high
      model_info:
        max_input_tokens: 128000
        max_output_tokens: 16384

  - model_name: default
    litellm_params:
      model: openai/xiaomi/mimo-v2.5
      api_base: https://api.cline.bot/api/v1
      api_key: os.environ/KEY_AI_CLINE
      order: 2
      tpm: 128000
      rpm: 30
      reasoning_effort: high
      model_info:
        max_input_tokens: 128000
        max_output_tokens: 16384

  - model_name: default
    litellm_params:
      model: openai/deepseek/deepseek-v4-flash
      api_base: https://api.commandcode.ai/provider/v1
      api_key: os.environ/KEY_AI_COMMAND_CODE
      order: 2
      tpm: 128000
      rpm: 30
      reasoning_effort: high
      model_info:
        max_input_tokens: 128000
        max_output_tokens: 16384

  - model_name: default
    litellm_params:
      model: openai/mimo-v2.5
      api_base: https://opencode.ai/zen/go/v1
      api_key: os.environ/KEY_AI_OPENCODE_GO_1
      order: 2
      tpm: 128000
      rpm: 30
      reasoning_effort: high
      model_info:
        max_input_tokens: 128000
        max_output_tokens: 16384

  - model_name: default
    litellm_params:
      model: openrouter/xiaomi/mimo-v2.5
      api_key: os.environ/KEY_AI_OPENROUTER
      order: 3
      tpm: 128000
      rpm: 30
      reasoning_effort: high
      model_info:
        max_input_tokens: 128000
        max_output_tokens: 16384
