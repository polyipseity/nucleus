---
# LiteLLM proxy configuration — shared across all hosts.
#
# AI gateway on 127.0.0.1:4000 routing to:
#   - Local Ollama daemon (127.0.0.1:11434) for offline models
#   - A single generic `default` model backed by remote providers, selected
#     by `order` tier (primary → paid → fallback).  API keys from SOPS secrets.

litellm_settings:
  # Drop unsupported client params (e.g. max_tokens) per-endpoint.
  drop_params: true

# WARNING suppresses per-request INFO chatter while still capturing
# errors, warnings, and startup diagnostics.
general_settings:
  environment_variables:
    LITELLM_LOG: WARNING

# enable_pre_call_checks=true is required for the `order` field
# (primary/fallback tier selection) to be respected.  simple-shuffle
# randomizes endpoint selection within a tier.  The cooldown combo
# (allowed_fails/cooldown_time) benches a deployment after 3 failures
# for 60 s, with 5 s between retries.
router_settings:
  enable_pre_call_checks: true
  num_retries: 3
  retry_after: 5
  allowed_fails: 3
  cooldown_time: 60
  routing_strategy: simple-shuffle

model_list:
  # ---- Ollama models ----
  - model_name: ollama_chat/devstral-small-2:24b
    litellm_params:
      model: ollama_chat/devstral-small-2:24b
      api_base: http://127.0.0.1:11434
      model_info:
        max_input_tokens: 32768
        max_output_tokens: 8192

  - model_name: ollama_chat/qwen2.5:1.5b
    litellm_params:
      model: ollama_chat/qwen2.5:1.5b
      api_base: http://127.0.0.1:11434
      model_info:
        max_input_tokens: 32768
        max_output_tokens: 8192

  - model_name: ollama_chat/qwen3:8b
    litellm_params:
      model: ollama_chat/qwen3:8b
      api_base: http://127.0.0.1:11434
      model_info:
        max_input_tokens: 32768
        max_output_tokens: 8192

  # ---- Default model (generic, remote-backed) ----
  # Single public `default` model.  `order` tiers primary → paid → fallback.
  # Highest thinking via reasoning_effort: high (drop_params drops it on any
  # upstream that rejects it).  Public name never exposes the upstream model.
  - model_name: default
    litellm_params:
      model: openai/hy3-free
      api_base: https://opencode.ai/zen/v1
      api_key: os.environ/OPENCODE_ZEN_API_KEY
      order: 1
      reasoning_effort: high
      model_info:
        max_input_tokens: 256000
        max_output_tokens: 8192
  - model_name: default
    litellm_params:
      model: openai/hy3
      api_base: https://opencode.ai/zen/go/v1
      api_key: os.environ/OPENCODE_GO_API_KEY
      order: 2
      reasoning_effort: high
      model_info:
        max_input_tokens: 256000
        max_output_tokens: 8192
  - model_name: default
    litellm_params:
      model: openai/tencent/hy3-paid
      api_base: https://api.commandcode.ai/provider/v1
      api_key: os.environ/COMMAND_CODE_API_KEY
      order: 2
      reasoning_effort: high
      model_info:
        max_input_tokens: 256000
        max_output_tokens: 8192
  - model_name: default
    litellm_params:
      model: openrouter/tencent/hy3
      api_key: os.environ/OPENROUTER_API_KEY
      order: 3
      reasoning_effort: high
      model_info:
        max_input_tokens: 256000
        max_output_tokens: 8192
