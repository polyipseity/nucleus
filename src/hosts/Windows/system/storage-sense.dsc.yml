# WinGet DSC v3 - HKLM Storage Sense policy values
properties:
  configurationVersion: 0.2.0
  resources:
    - resource: Microsoft.Windows.Registry/RegistryValue
      directives:
        description: >-
          Enable Storage Sense for automatic disk cleanup (Microsoft Policy CSP
          Storage/AllowStorageSenseGlobal). Storage Sense natively handles
          Recycle Bin, temporary files, and Downloads cleanup at the configured
          cadence, replacing the previous COM-based Recycle Bin scheduled task
          with a first-party Windows mechanism.
      settings:
        keyPath: HKLM\Software\Policies\Microsoft\Windows\StorageSense
        valueName: AllowStorageSenseGlobal
        valueData: 1
        valueType: DWord

    - resource: Microsoft.Windows.Registry/RegistryValue
      directives:
        description: >-
          Run Storage Sense daily at 12:00 local time (Microsoft Policy CSP
          Storage/ConfigStorageSenseGlobalCadence). Daily execution provides
          prompt cleanup while avoiding the overhead of continuous monitoring.
      settings:
        keyPath: HKLM\Software\Policies\Microsoft\Windows\StorageSense
        valueName: ConfigStorageSenseGlobalCadence
        valueData: 1
        valueType: DWord

    - resource: Microsoft.Windows.Registry/RegistryValue
      directives:
        description: >-
          Set Recycle Bin cleanup threshold to 30 days (Microsoft Policy CSP
          Storage/ConfigStorageSenseRecycleBinCleanupThreshold). Cross-host
          parity with the macOS Finder 30-day Trash auto-prune
          (FXRemoveOldTrashItems).
      settings:
        keyPath: HKLM\Software\Policies\Microsoft\Windows\StorageSense
        valueName: ConfigStorageSenseRecycleBinCleanupThreshold
        valueData: 30
        valueType: DWord
