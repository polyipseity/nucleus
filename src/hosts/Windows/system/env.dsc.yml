---
# WinGet DSC v3 - Machine-scope environment variables for Windows host.
# ref: env-variable-scope.instructions.md -- env var scope policy
# ref: src/modules/lib/env-catalog.nix -- Nix-side catalog of managed env vars
#
# Elevation policy: nucleus-apply must self-elevate (UAC admin) before any
# configuration step. Machine-scope (HKLM) resources are therefore always
# accessible. Non-user-specific env vars go to Machine scope. Do NOT move
# vars to User scope as an "elevation workaround" — that is a bug.
# If elevation fails, apply.ps1 must hard-fail.
#
# NUCLEUS_HOST persists at Machine scope; apply.ps1 sets a process-level
# value ($env:NUCLEUS_HOST) for subprocess visibility during the same run.
$schema: https://aka.ms/configuration-dsc-schema/0.2
properties:
  configurationVersion: 0.2.0
  resources:
    - resource: Microsoft.Windows.Environment/Variable
      id: ccMachineEnvVar
      directives:
        description: >-
          Set CC to clang at Machine scope for all-process visibility.
          Resolved from PATH at process creation.  Mirrors CC set in
          src/modules/lib/env-catalog.nix on POSIX hosts.
        settings:
          name: CC
          value: clang
          scope: Machine

    - resource: Microsoft.Windows.Environment/Variable
      id: cxxMachineEnvVar
      directives:
        description: >-
          Set CXX to clang++ at Machine scope for all-process visibility.
          Resolved from PATH at process creation.  Mirrors CXX set in
          src/modules/lib/env-catalog.nix on POSIX hosts.
        settings:
          name: CXX
          value: clang++
          scope: Machine

    - resource: Microsoft.Windows.Environment/Variable
      id: editorMachineEnvVar
      directives:
        description: >-
          Set EDITOR to nvim at Machine scope so all users inherit the
          preferred editor.  Mirrors EDITOR set in src/modules/lib/env-catalog.nix
          on POSIX hosts.
        settings:
          name: EDITOR
          value: nvim
          scope: Machine

    - resource: Microsoft.Windows.Environment/Variable
      id: ldMachineEnvVar
      directives:
        description: >-
          Set LD to ld.lld at Machine scope for all-process visibility.
          Resolved from PATH at process creation.  Mirrors LD set in
          src/modules/lib/env-catalog.nix on POSIX hosts.
        settings:
          name: LD
          value: ld.lld
          scope: Machine

    - resource: Microsoft.Windows.Environment/Variable
      id: nextestTestThreadsMachineEnvVar
      directives:
        description: >-
          Limit cargo-nextest test runner concurrency to 4 parallel test
          threads at Machine scope for all-process visibility. Mirrors
          NEXTEST_TEST_THREADS set in src/modules/lib/env-catalog.nix
          on POSIX hosts.
        settings:
          name: NEXTEST_TEST_THREADS
          value: "4"
          scope: Machine

    - resource: Microsoft.Windows.Environment/Variable
      id: nixPathMachineEnvVar
      directives:
        description: >-
          Register nixpkgs in NIX_PATH so <nixpkgs> references in Nix
          expressions resolve via the flake registry without a channels
          configuration. Mirrors NIX_PATH set in src/modules/lib/env-catalog.nix.
        settings:
          name: NIX_PATH
          value: nixpkgs=flake:nixpkgs
          scope: Machine

    - resource: Microsoft.Windows.Environment/Variable
      id: nucleusHostMachineEnvVar
      directives:
        description: >-
          Set NUCLEUS_HOST to "Windows" at Machine scope so that all users
          inherit the host identifier.
        settings:
          name: NUCLEUS_HOST
          value: Windows
          scope: Machine

    - resource: Microsoft.Windows.Environment/Variable
      id: ollamaContextLengthMachineEnvVar
      directives:
        description: >-
          Set a 32 k token default context window so models that default to
          2 k or 4 k do not silently truncate long conversations.  Mirrors
          OLLAMA_CONTEXT_LENGTH set in the macOS launchd agent and the NixOS
          services.ollama.environmentVariables block.
        settings:
          name: OLLAMA_CONTEXT_LENGTH
          value: "32768"
          scope: Machine

    - resource: Microsoft.Windows.Environment/Variable
      id: ollamaFlashAttentionMachineEnvVar
      directives:
        description: >-
          Enable Ollama flash attention to reduce memory overhead of the
          attention mechanism during inference.  Mirrors
          OLLAMA_FLASH_ATTENTION set in the macOS launchd agent and the NixOS
          services.ollama.environmentVariables block.
        settings:
          name: OLLAMA_FLASH_ATTENTION
          value: "1"
          scope: Machine

    - resource: Microsoft.Windows.Environment/Variable
      id: ollamaHostMachineEnvVar
      directives:
        description: >-
          Point clients at the LiteLLM proxy (127.0.0.1:4000) instead of
          Ollama directly for unified routing to local and remote models.
          Mirrors OLLAMA_HOST set in home.sessionVariables on POSIX hosts.
        settings:
          name: OLLAMA_HOST
          value: "127.0.0.1:4000"
          scope: Machine

    - resource: Microsoft.Windows.Environment/Variable
      id: ollamaKvCacheTypeMachineEnvVar
      directives:
        description: >-
          Compress the KV cache with 4-bit quantisation to halve the
          KV-cache RAM footprint.  Mirrors OLLAMA_KV_CACHE_TYPE set in the
          macOS launchd agent and the NixOS services.ollama.environmentVariables
          block.
        settings:
          name: OLLAMA_KV_CACHE_TYPE
          value: q4_0
          scope: Machine

    - resource: Microsoft.Windows.Environment/Variable
      id: opencodeDisableAutoupdateMachineEnvVar
      directives:
        description: >-
          Disable OpenCode auto-update globally to avoid version skew across
          machines.  Mirrors OPENCODE_DISABLE_AUTOUPDATE set in
          src/modules/lib/env-catalog.nix on POSIX hosts.
        settings:
          name: OPENCODE_DISABLE_AUTOUPDATE
          value: "true"
          scope: Machine

    - resource: Microsoft.Windows.Environment/Variable
      id: redisHostMachineEnvVar
      directives:
        description: >-
          LiteLLM Redis coordination and response cache endpoint.
          Mirrors REDIS_HOST set in src/modules/lib/env-catalog.nix on POSIX hosts.
        settings:
          name: REDIS_HOST
          value: "127.0.0.1"
          scope: Machine

    - resource: Microsoft.Windows.Environment/Variable
      id: redisPortMachineEnvVar
      directives:
        description: >-
          LiteLLM Redis coordination and response cache port.
          Mirrors REDIS_PORT set in src/modules/lib/env-catalog.nix on POSIX hosts.
        settings:
          name: REDIS_PORT
          value: "6379"
          scope: Machine

    - resource: Microsoft.Windows.Environment/Variable
      id: visualMachineEnvVar
      directives:
        description: >-
          Set VISUAL to nvim at Machine scope so all users inherit the
          preferred editor.  Mirrors VISUAL set in src/modules/lib/env-catalog.nix
          on POSIX hosts.
        settings:
          name: VISUAL
          value: nvim
          scope: Machine

    - resource: Microsoft.Windows.Environment/Variable
      id: cmakeCCompilerLauncherMachineEnvVar
      directives:
        description: >-
          Set CMAKE_C_COMPILER_LAUNCHER to sccache at Machine scope for
          CMake C compiler caching. Mirrors CMAKE_C_COMPILER_LAUNCHER set
          in src/modules/lib/env-catalog.nix on POSIX hosts.
        settings:
          name: CMAKE_C_COMPILER_LAUNCHER
          value: sccache
          scope: Machine

    - resource: Microsoft.Windows.Environment/Variable
      id: cmakeCxxCompilerLauncherMachineEnvVar
      directives:
        description: >-
          Set CMAKE_CXX_COMPILER_LAUNCHER to sccache at Machine scope for
          CMake C++ compiler caching. Mirrors CMAKE_CXX_COMPILER_LAUNCHER set
          in src/modules/lib/env-catalog.nix on POSIX hosts.
        settings:
          name: CMAKE_CXX_COMPILER_LAUNCHER
          value: sccache
          scope: Machine

    - resource: Microsoft.Windows.Environment/Variable
      id: sccacheCacheSizeMachineEnvVar
      directives:
        description: >-
          Set sccache cache size to 10 GB at Machine scope. Mirrors
          SCCACHE_CACHE_SIZE set in src/modules/lib/env-catalog.nix
          on POSIX hosts.
        settings:
          name: SCCACHE_CACHE_SIZE
          value: "10000000000"
          scope: Machine

    - resource: Microsoft.Windows.Environment/Variable
      id: sccacheIdleTimeoutMachineEnvVar
      directives:
        description: >-
          Set sccache idle timeout to 600 seconds (10 minutes) at Machine
          scope. Mirrors SCCACHE_IDLE_TIMEOUT set in
          src/modules/lib/env-catalog.nix on POSIX hosts.
        settings:
          name: SCCACHE_IDLE_TIMEOUT
          value: "600"
          scope: Machine

    - resource: Microsoft.Windows.Environment/Variable
      id: sccacheIgnoreServerIoErrorMachineEnvVar
      directives:
        description: >-
          Set SCCACHE_IGNORE_SERVER_IO_ERROR to 0 (hard-fail) at Machine
          scope. Mirrors SCCACHE_IGNORE_SERVER_IO_ERROR set in
          src/modules/lib/env-catalog.nix on POSIX hosts.
        settings:
          name: SCCACHE_IGNORE_SERVER_IO_ERROR
          value: "0"
          scope: Machine
