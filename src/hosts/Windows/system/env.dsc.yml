# WinGet DSC v3 - Machine-scope environment variables for Windows host.
# Cross-reference: docs/env-variable-registry.md
# Nix-side source of truth: src/modules/lib/env-vars.nix
#
# Phase 2 of the NUCLEUS_HOST two-phase promotion (Phase 1 sets User scope
# in apply.ps1).  Setting NUCLEUS_HOST on Machine scope ensures all users
# inherit the host identity.
#
# NOTE: Machine-scope Environment resources require elevation.  When applied
# via winget configure from a non-admin session, a UAC prompt is shown.
properties:
  configurationVersion: 0.2.0
  resources:
    - resource: Microsoft.Windows.Environment/Variable
      id: nucleusHostMachineEnvVar
      directives:
        description: >-
          Set NUCLEUS_HOST to "Windows" at Machine scope so that all users
          inherit the host identifier.  Phase 2 of the two-phase promotion;
          Phase 1 (User scope) is set in apply.ps1 for environments without
          admin access.
        settings:
          name: NUCLEUS_HOST
          value: Windows
          scope: Machine
