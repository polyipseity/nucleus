# WinGet DSC v3 - scheduled task for weekly garbage collection
properties:
  configurationVersion: 0.2.0
  resources:
    - resource: Microsoft.Windows.Settings/TaskScheduler
      directives:
        description: >-
          Schedule weekly garbage collection on Sunday at 12:00 local time to reclaim stale
          VM artifacts, build outputs, and tool caches (mirrors macOS launchd and NixOS
          systemd timers for cross-host gc parity). The task uses $env:NUCLEUS_REPO_ROOT
          (set by apply.ps1) to locate the gc script.
      settings:
        TaskPath: \nucleus\
        TaskName: gc-weekly
        TaskDescriptionLiteral: Scheduled weekly garbage collection cleanup
        Action: |
          $RepoRoot = $env:NUCLEUS_REPO_ROOT
          if (-not $RepoRoot) {
            Write-Output "gc: NUCLEUS_REPO_ROOT not set; run via apply.ps1"
            exit 1
          }
          $GcScript = Join-Path $RepoRoot "scripts\gc.ps1"
          $ModuleDir = Join-Path $RepoRoot "src\hosts\Windows\modules"
          if (-not (Test-Path $GcScript)) {
            Write-Output "gc: scripts/gc.ps1 not found; skipping weekly GC"
            exit 1
          }
          & $GcScript -ModuleDir $ModuleDir -RepoRoot $RepoRoot
        Trigger: Weekly
        DaysOfWeek: Sunday
        AtTime: 12:00
        Enabled: true
        RunWithHighestPrivileges: false
        RunOnlyWhenNetworkAvailable: false
        RunOnlyIfLoggedOn: true

    - resource: Microsoft.Windows.Settings/TaskScheduler
      directives:
        description: >-
          Periodic service watchdog — detects and restarts nucleus-managed
          services stuck in non-running states.  Invokes scripts/service-watchdog.ps1
          which checks native SCM services and scheduled tasks.  Every 5 minutes
          (repeated indefinitely).  Mirrors macOS launchd agent
          (local.service-watchdog, StartInterval=300) and NixOS systemd timer
          (nucleus-service-watchdog, OnUnitActiveSec=5min).
      settings:
        TaskPath: \nucleus\
        TaskName: service-watchdog
        TaskDescriptionLiteral: >-
          Service watchdog — restart stuck nucleus services.
        Action: |
          $RepoRoot = $env:NUCLEUS_REPO_ROOT
          if (-not $RepoRoot) {
            Write-Output "watchdog: NUCLEUS_REPO_ROOT not set; run via apply.ps1"
            exit 1
          }
          $WatchdogScript = Join-Path $RepoRoot "scripts\service-watchdog.ps1"
          if (-not (Test-Path $WatchdogScript)) {
            Write-Output "watchdog: scripts/service-watchdog.ps1 not found"
            exit 1
          }
          & $WatchdogScript
        Trigger: Once
        AtTime: "1970-01-01T00:00:00"
        Enabled: true
        RunWithHighestPrivileges: false
        RunOnlyWhenNetworkAvailable: false
        RunOnlyIfLoggedOn: true
        Repetition:
          Interval: PT5M
          Duration: P1D
          StopAtDurationEnd: false
