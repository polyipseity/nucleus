---
# WinGet DSC v3 - scheduled task for weekly garbage collection
$schema: https://aka.ms/configuration-dsc-schema/0.2
properties:
  configurationVersion: 0.2.0
  resources:
    - resource: Microsoft.Windows.Settings/TaskScheduler
      directives:
        description: >-
          Schedule weekly garbage collection on Sunday at 12:00 local time to reclaim stale
          VM artifacts, build outputs, and tool caches (mirrors macOS launchd and NixOS
          systemd timers for cross-host gc parity). The task uses $env:NUCLEUS_REPO_ROOT
          (set by apply.ps1) to locate the gc script.
      settings:
        TaskPath: \nucleus\
        TaskName: gc-weekly
        TaskDescriptionLiteral: Scheduled weekly garbage collection cleanup
        Action: |
          $RepoRoot = $env:NUCLEUS_REPO_ROOT
          if (-not $RepoRoot) {
            Write-Output "gc: NUCLEUS_REPO_ROOT not set; run via apply.ps1"
            exit 1
          }
          $GcScript = Join-Path $RepoRoot "scripts\gc.ps1"
          $ModuleDir = Join-Path $RepoRoot "src\hosts\Windows\modules"
          & $GcScript -ModuleDir $ModuleDir -RepoRoot $RepoRoot
        Trigger: Weekly
        DaysOfWeek: Sunday
        AtTime: 12:00
        Enabled: true
        RunWithHighestPrivileges: false
        RunOnlyWhenNetworkAvailable: false
        RunOnlyIfLoggedOn: true

    - resource: Microsoft.Windows.Settings/TaskScheduler
      directives:
        description: >-
          Persistent service watchdog — detects and restarts nucleus-managed
          services stuck in non-running states.  Internal 300s sleep loop.
          Mirrors macOS launchd daemon (KeepAlive=true, internal 300s loop)
          and NixOS systemd service (Restart=always, internal 300s loop).
      settings:
        TaskPath: \nucleus\
        TaskName: service-watchdog
        TaskDescriptionLiteral: >-
          Service watchdog — restart stuck nucleus services.
        Action: |
          $RepoRoot = $env:NUCLEUS_REPO_ROOT
          if (-not $RepoRoot) {
            Write-Output "watchdog: NUCLEUS_REPO_ROOT not set; run via apply.ps1"
            exit 1
          }
          $WatchdogScript = Join-Path $RepoRoot "src\scripts\services\service-watchdog.ps1"
          if (-not (Test-Path $WatchdogScript)) {
            Write-Output "watchdog: src/scripts/services/service-watchdog.ps1 not found"
            exit 1
          }
          & $WatchdogScript
        Trigger: AtStartup
        Enabled: true
        RunWithHighestPrivileges: true
        RunOnlyWhenNetworkAvailable: false
        RunOnlyIfLoggedOn: false

    - resource: Microsoft.Windows.Settings/TaskScheduler
      directives:
        description: >-
          Daily sccache cache clearing at 12:00 local time. Mirrors macOS
          launchd agent and NixOS systemd timer for cross-host gc parity.
        settings:
          TaskPath: \nucleus\
          TaskName: sccache-gc
          TaskDescriptionLiteral: Daily sccache compilation cache clearing
          Action: |
            $RepoRoot = $env:NUCLEUS_REPO_ROOT
            if (-not $RepoRoot) {
              Write-Output "sccache-gc: NUCLEUS_REPO_ROOT not set; run via apply.ps1"
              exit 1
            }
            $SccacheGcScript = Join-Path $RepoRoot "src\scripts\services\sccache-gc.ps1"
            if (-not (Test-Path -LiteralPath $SccacheGcScript -PathType Leaf)) {
              Write-Output "sccache-gc: src/scripts/services/sccache-gc.ps1 not found"
              exit 1
            }
            & $SccacheGcScript
          Trigger: Daily
          AtTime: 12:00
          DaysInterval: 1
          Enabled: true
          RunWithHighestPrivileges: false
          RunOnlyIfLoggedOn: true

    - resource: Microsoft.Windows.Settings/TaskScheduler
      directives:
        description: >-
          Daily system log rotation at 12:00 local time. Mirrors macOS launchd
          daemon and NixOS systemd timer for root-owned nucleus service logs.
      settings:
        TaskPath: \nucleus\
        TaskName: log-gc-system
        TaskDescriptionLiteral: Daily system log rotation for nucleus services
        Action: |
          $RepoRoot = $env:NUCLEUS_REPO_ROOT
          if (-not $RepoRoot) {
            Write-Output "log-gc-system: NUCLEUS_REPO_ROOT not set; run via apply.ps1"
            exit 1
          }
          $LogGcScript = Join-Path $RepoRoot "src\scripts\services\log-gc-system.ps1"
          if (-not (Test-Path -LiteralPath $LogGcScript -PathType Leaf)) {
            Write-Output "log-gc-system: src/scripts/services/log-gc-system.ps1 not found"
            exit 1
          }
          & $LogGcScript
        Trigger: Daily
        AtTime: 12:00
        DaysInterval: 1
        Enabled: true
        RunWithHighestPrivileges: true
        RunOnlyIfLoggedOn: false
