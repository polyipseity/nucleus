---
# WinGet DSC v3 - user-level "strip metadata" context menu entries
# One entry per Office extension (docx/xlsx/pptx + doc/xls/ppt).
# Sorting policy: alphabetical by extension. No automatic sorting.
$schema: https://aka.ms/configuration-dsc-schema/0.2
properties:
  configurationVersion: 0.2.0
  resources:
    # .docx — Word (OOXML)
    - resource: Microsoft.Windows.Registry/RegistryValue
      id: stripMetadataVerbDocx
      directives:
        description: Add "strip metadata" to the right-click context menu for .docx files
      settings:
        keyPath: HKCU\Software\Classes\SystemFileAssociations\.docx\shell\strip metadata
        valueData: "strip metadata"
        valueType: String
    - resource: Microsoft.Windows.Registry/RegistryValue
      id: stripMetadataCmdDocx
      directives:
        description: Command for the strip metadata context menu entry on .docx files
      settings:
        keyPath: HKCU\Software\Classes\SystemFileAssociations\.docx\shell\strip metadata\command
        valueData: >-
          powershell.exe -NoProfile -WindowStyle Hidden -Command
          "nucleus-utils strip-metadata '%1'"
        valueType: String

