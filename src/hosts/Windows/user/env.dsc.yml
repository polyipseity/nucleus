---
# WinGet DSC v3 - user-level environment variables for Windows host.
# Cross-reference: env-variable-scope.instructions.md
# Nix-side source of truth: src/modules/lib/env-catalog.nix
#
# Elevation policy: nucleus-apply must self-elevate (UAC admin) before any
# configuration step. Machine-scope (HKLM) resources are therefore always
# accessible. Non-user-specific env vars go to Machine scope. Do NOT move
# vars to User scope as an "elevation workaround" — that is a bug.
# If elevation fails, apply.ps1 must hard-fail.
#
# This file contains only user-specific vars (depends on the logged-in user).
# Non-user-specific vars live in system/env.dsc.yml (Machine scope).
$schema: https://aka.ms/configuration-dsc-schema/0.2
properties:
  configurationVersion: 0.2.0
  resources:
    - resource: Microsoft.Windows.Environment/Variable
      id: gopassConfigCountEnvVar
      directives:
        description: >-
          Register password-store path count override so gopass resolves the
          managed password-store location instead of its default config.
          Mirrors GOPASS_CONFIG_COUNT set in home.sessionVariables on POSIX hosts.
      settings:
        name: GOPASS_CONFIG_COUNT
        value: "1"
        scope: User

    - resource: Microsoft.Windows.Environment/Variable
      id: gopassConfigKey1EnvVar
      directives:
        description: >-
          First password-store path override key for gopass.
          Mirrors GOPASS_CONFIG_KEY_1 set in home.sessionVariables on POSIX hosts.
      settings:
        name: GOPASS_CONFIG_KEY_1
        value: path
        scope: User

    - resource: Microsoft.Windows.Environment/Variable
      id: gopassConfigValue1EnvVar
      directives:
        description: >-
          First password-store path override value for gopass, pointing at
          the managed monorepo-private password store.
          Mirrors GOPASS_CONFIG_VALUE_1 set in home.sessionVariables on POSIX hosts.
      settings:
        name: GOPASS_CONFIG_VALUE_1
        value: '%USERPROFILE%\dev\monorepo-private\self\passwords'
        scope: User

    - resource: Microsoft.Windows.Environment/Variable
      id: homeEnvVar
      directives:
        description: Set HOME to %USERPROFILE% so Unix-heritage tools (git, ssh, curl) find the expected home directory path on Windows
      settings:
        name: HOME
        value: "%USERPROFILE%"
        scope: User

    # Source: https://nixos.org/manual/nix/stable/language/string-interpolation.html#lookup-path
    - resource: Microsoft.Windows.Environment/Variable
      id: nixPathEnvVar
      directives:
        description: Register nixpkgs in NIX_PATH so <nixpkgs> references in Nix expressions resolve via the flake registry without a channels configuration
      settings:
        name: NIX_PATH
        value: nixpkgs=flake:nixpkgs
        scope: User

    - resource: Microsoft.Windows.Environment/Variable
      id: passwordStoreDirEnvVar
      directives:
        description: >-
          Point pass, QtPass, and gopass at the managed monorepo-private
          password store.  Mirrors PASSWORD_STORE_DIR set in home.sessionVariables
          on POSIX hosts.
      settings:
        name: PASSWORD_STORE_DIR
        value: '%USERPROFILE%\dev\monorepo-private\self\passwords'
        scope: User

    - resource: Microsoft.Windows.Environment/Variable
      id: starshipCacheEnvVar
      directives:
        description: >-
          Set Starship cache directory to match the POSIX default location.
          Mirrors STARSHIP_CACHE set in home.sessionVariables on POSIX hosts.
      settings:
        name: STARSHIP_CACHE
        value: '%USERPROFILE%\.cache\starship'
        scope: User

    - resource: Microsoft.Windows.Environment/Variable
      id: starshipConfigEnvVar
      directives:
        description: >-
          Point Starship at the managed config file deployed by nucleus
          (src/modules/configs/starship/starship.toml). The path matches the default
          POSIX home-manager XDG config path for cross-host parity.
      settings:
        name: STARSHIP_CONFIG
        value: "%USERPROFILE%\\.config\\starship.toml"
        scope: User
    - resource: Microsoft.Windows.Environment/Variable
      id: sccacheBaseDirsEnvVar
      directives:
        description: >-
          Set SCCACHE_BASEDIRS to %USERPROFILE% at User scope for sccache
          cache key normalisation. Mirrors SCCACHE_BASEDIRS set in
          src/modules/lib/env-catalog.nix on POSIX hosts.
      settings:
        name: SCCACHE_BASEDIRS
        value: "%USERPROFILE%"
        scope: User

    - resource: Microsoft.Windows.Environment/Variable
      id: nextestTestThreadsEnvVar
      directives:
        description: >-
          Limit cargo-nextest test runner concurrency to 4 parallel test
          threads. Mirrors NEXTEST_TEST_THREADS set in home.sessionVariables
          on POSIX hosts.
      settings:
        name: NEXTEST_TEST_THREADS
        value: "4"
        scope: User
