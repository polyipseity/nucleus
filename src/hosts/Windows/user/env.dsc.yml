# WinGet DSC v3 - user-level environment variables for Windows host.
# Cross-reference: docs/env-variable-registry.md
# Nix-side source of truth: src/modules/lib/env-vars.nix
properties:
  configurationVersion: 0.2.0
  resources:
    - resource: Microsoft.Windows.Environment/Variable
      id: editorEnvVar
      directives:
        description: Set EDITOR to nvim to mirror the default editor behavior declared for macOS and NixOS
      settings:
        name: EDITOR
        value: nvim
        scope: User

    - resource: Microsoft.Windows.Environment/Variable
      id: gopassConfigCountEnvVar
      directives:
        description: >-
          Register password-store path count override so gopass resolves the
          managed password-store location instead of its default config.
          Mirrors GOPASS_CONFIG_COUNT set in home.sessionVariables on POSIX hosts.
      settings:
        name: GOPASS_CONFIG_COUNT
        value: "1"
        scope: User

    - resource: Microsoft.Windows.Environment/Variable
      id: gopassConfigKey1EnvVar
      directives:
        description: >-
          First password-store path override key for gopass.
          Mirrors GOPASS_CONFIG_KEY_1 set in home.sessionVariables on POSIX hosts.
      settings:
        name: GOPASS_CONFIG_KEY_1
        value: path
        scope: User

    - resource: Microsoft.Windows.Environment/Variable
      id: gopassConfigValue1EnvVar
      directives:
        description: >-
          First password-store path override value for gopass, pointing at
          the managed monorepo-private password store.
          Mirrors GOPASS_CONFIG_VALUE_1 set in home.sessionVariables on POSIX hosts.
      settings:
        name: GOPASS_CONFIG_VALUE_1
        value: "%USERPROFILE%\dev\monorepo-private\self\passwords"
        scope: User

    - resource: Microsoft.Windows.Environment/Variable
      id: homeEnvVar
      directives:
        description: Set HOME to %USERPROFILE% so Unix-heritage tools (git, ssh, curl) find the expected home directory path on Windows
      settings:
        name: HOME
        value: "%USERPROFILE%"
        scope: User

    # Source: https://nixos.org/manual/nix/stable/language/string-interpolation.html#lookup-path
    - resource: Microsoft.Windows.Environment/Variable
      id: nixPathEnvVar
      directives:
        description: Register nixpkgs in NIX_PATH so <nixpkgs> references in Nix expressions resolve via the flake registry without a channels configuration
      settings:
        name: NIX_PATH
        value: nixpkgs=flake:nixpkgs
        scope: User

    - resource: Microsoft.Windows.Environment/Variable
      id: nucleusDefaultDevBinEnvVar
      directives:
        description: >-
          Set the fallback toolchain binary directory to the Scoop shims path so
          managed dev-tool wrappers can find bun, prek, and uv outside a Nix
          development shell.  Mirrors NUCLEUS_DEFAULT_DEV_BIN set in
          home.sessionVariables on POSIX hosts and is consumed by
          Invoke-NucleusManagedDevTool in Sync-ShellProfile.ps1.
      settings:
        name: NUCLEUS_DEFAULT_DEV_BIN
        value: "%USERPROFILE%\scoop\shims"
        scope: User

    - resource: Microsoft.Windows.Environment/Variable
      id: nucleusDefaultDevEnvEnvVar
      directives:
        description: >-
          Flag that declares the fallback toolchain is configured so direnv and
          dev-tool wrappers can distinguish managed environments from unmanaged
          ones.  Mirrors NUCLEUS_DEFAULT_DEV_ENV set in home.sessionVariables on
          POSIX hosts.
      settings:
        name: NUCLEUS_DEFAULT_DEV_ENV
        value: "1"
        scope: User

    - resource: Microsoft.Windows.Environment/Variable
      id: ollamaFlashAttentionEnvVar
      directives:
        description: >-
          Enable Ollama flash attention to reduce the memory overhead of the
          attention mechanism during inference, keeping peak VRAM usage lower
          on GPU-backed sessions and reducing RAM pressure on CPU-only runs.
          Mirrors OLLAMA_FLASH_ATTENTION set in the macOS launchd agent and
          the NixOS services.ollama.environmentVariables block (source:
          https://docs.ollama.com/faq#how-can-i-enable-flash-attention).
      settings:
        name: OLLAMA_FLASH_ATTENTION
        value: "1"
        scope: User

    - resource: Microsoft.Windows.Environment/Variable
      id: ollamaHostEnvVar
      directives:
        description: >-
          Point clients at the LiteLLM proxy (127.0.0.1:4000) instead of Ollama
          directly so that oterm, ollama run, and any other OpenAI-compatible
          client gets unified routing to both local and remote models.  Sync
          scripts override this back to :11434 for direct model management.
          Mirrors OLLAMA_HOST set in home.sessionVariables on macOS and NixOS.
      settings:
        name: OLLAMA_HOST
        value: "127.0.0.1:4000"
        scope: User

    - resource: Microsoft.Windows.Environment/Variable
      id: ollamaKvCacheTypeEnvVar
      directives:
        description: >-
          Compress the KV cache with 4-bit quantisation to halve the KV-cache
          RAM footprint so larger context windows fit without evicting model
          weights.  Mirrors OLLAMA_KV_CACHE_TYPE set in the macOS launchd
          agent and the NixOS services.ollama.environmentVariables block
          (source:
          https://docs.ollama.com/faq#how-can-i-set-the-quantization-type-for-the-kv-cache).
      settings:
        name: OLLAMA_KV_CACHE_TYPE
        value: q4_0
        scope: User

    - resource: Microsoft.Windows.Environment/Variable
      id: ollamaNumCtxEnvVar
      directives:
        description: >-
          Set a 32 k token default context window so models that default to
          2 k or 4 k do not silently truncate long conversations.  Mirrors
          OLLAMA_CONTEXT_LENGTH set in the macOS launchd agent and the NixOS
          services.ollama.environmentVariables block (source:
          https://docs.ollama.com/faq#how-can-i-specify-the-context-window-size).
      settings:
        name: OLLAMA_CONTEXT_LENGTH
        value: "32768"
        scope: User

    - resource: Microsoft.Windows.Environment/Variable
      id: passwordStoreDirEnvVar
      directives:
        description: >-
          Point pass, QtPass, and gopass at the managed monorepo-private
          password store.  Mirrors PASSWORD_STORE_DIR set in home.sessionVariables
          on POSIX hosts.
      settings:
        name: PASSWORD_STORE_DIR
        value: "%USERPROFILE%\dev\monorepo-private\self\passwords"
        scope: User

    - resource: Microsoft.Windows.Environment/Variable
      id: pathEnvVar
      directives:
        description: >-
          Prepend user-scope package manager binary directories to PATH so
          GUI-launched processes (Electron apps, Windows Terminal, etc.) can
          find bun, cargo, uv, and other managed tools.  Merges with the
          Machine-scope system PATH via Windows SetEnvironmentVariable.
          Mirrors the managed PATH components in src/modules/lib/env-vars.nix
          (pathComponents) and the macOS GUI domain launchctl setenv.
      settings:
        name: PATH
        value: "%USERPROFILE%\.bun\bin;%USERPROFILE%\.cargo\bin;%USERPROFILE%\.local\bin"
        scope: User

    - resource: Microsoft.Windows.Environment/Variable
      id: visualEnvVar
      directives:
        description: Set VISUAL to nvim so terminal tooling follows the same preferred editor as POSIX hosts
      settings:
        name: VISUAL
        value: nvim
        scope: User

    - resource: Microsoft.Windows.Environment/Variable
      id: opencodeDisableAutoupdateEnvVar
      directives:
        description: >-
          Disable OpenCode auto-update globally to avoid version skew across
          machines. Updates are controlled via flake updates and managed
          environment versioning (source: OpenCode CLI env var table
          OPENCODE_DISABLE_AUTOUPDATE —
          https://opencode.ai/docs/zh-tw/cli/#環境變數 ; OpenCode config
          autoupdate semantics —
          https://opencode.ai/docs/zh-tw/config/#自動更新).
      settings:
        name: OPENCODE_DISABLE_AUTOUPDATE
        value: "true"
        scope: User

    - resource: Microsoft.Windows.Environment/Variable
      id: starshipCacheEnvVar
      directives:
        description: >-
          Set Starship cache directory to match the POSIX default location.
          Mirrors STARSHIP_CACHE set in home.sessionVariables on POSIX hosts.
      settings:
        name: STARSHIP_CACHE
        value: "%USERPROFILE%\.cache\starship"
        scope: User

    - resource: Microsoft.Windows.Environment/Variable
      id: starshipConfigEnvVar
      directives:
        description: >-
          Point Starship at the managed config file deployed by nucleus
          (src/modules/configs/starship.toml). The path matches the default
          POSIX home-manager XDG config path for cross-host parity.
      settings:
        name: STARSHIP_CONFIG
        value: "%USERPROFILE%\\.config\\starship.toml"
        scope: User
