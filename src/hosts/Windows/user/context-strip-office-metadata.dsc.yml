---
# WinGet DSC v3 - user-level "strip office metadata" context menu entries
# One entry per Office extension (docx/xlsx/pptx + doc/xls/ppt).
# Sorting policy: alphabetical by extension. No automatic sorting.
$schema: https://aka.ms/configuration-dsc-schema/0.2
properties:
  configurationVersion: 0.2.0
  resources:
    # .docx — Word (OOXML)
    - resource: Microsoft.Windows.Registry/RegistryValue
      id: stripOfficeMetadataVerbDocx
      directives:
        description: Add "strip office metadata" to the right-click context menu for .docx files
      settings:
        keyPath: HKCU\Software\Classes\SystemFileAssociations\.docx\shell\strip office metadata
        valueData: "strip office metadata"
        valueType: String
    - resource: Microsoft.Windows.Registry/RegistryValue
      id: stripOfficeMetadataCmdDocx
      directives:
        description: Command for the strip office metadata context menu entry on .docx files
      settings:
        keyPath: HKCU\Software\Classes\SystemFileAssociations\.docx\shell\strip office metadata\command
        valueData: >-
          powershell.exe -NoProfile -WindowStyle Hidden -Command
          "nucleus-utils strip-office-metadata '%1'"
        valueType: String

