        valueType: String
    - resource: Microsoft.Windows.Registry/RegistryValue
      id: gsPdfOptCmdPrinter
      directives:
        description: Command for the optimize pdf (printer) context menu entry
      settings:
        keyPath: HKCU\Software\Classes\SystemFileAssociations\.pdf\shell\optimize pdf (printer)\command
        valueData: >-
          powershell.exe -NoProfile -WindowStyle Hidden -Command
