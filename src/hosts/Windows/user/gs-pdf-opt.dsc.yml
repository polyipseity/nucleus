# WinGet DSC v3 - user-level "optimize pdf" context menu entries for Windows
properties:
  configurationVersion: 0.2.0
  resources:
    # Adds per-preset "optimize pdf (<preset>)" entries to the right-click
    # context menu for .pdf files only.
    # Uses SystemFileAssociations\.pdf so the verb only appears on PDF files,
    # not all files (*). Presets are alphabetically sorted.
    - resource: Microsoft.Windows.Registry/RegistryValue
      id: gsPdfOptVerbDefault
      directives:
        description: Add "optimize pdf (default)" to the right-click context menu for PDF files
      settings:
        keyPath: HKCU\Software\Classes\SystemFileAssociations\.pdf\shell\optimize pdf (default)
        valueData: "optimize pdf (default)"
        valueType: String
    - resource: Microsoft.Windows.Registry/RegistryValue
      id: gsPdfOptCmdDefault
      directives:
        description: Command for the optimize pdf (default) context menu entry
      settings:
        keyPath: HKCU\Software\Classes\SystemFileAssociations\.pdf\shell\optimize pdf (default)\command
        valueData: >-
          powershell.exe -NoProfile -WindowStyle Hidden -Command
          "nucleus-gs-pdf-opt --preset default '%1'"
        valueType: String

    - resource: Microsoft.Windows.Registry/RegistryValue
      id: gsPdfOptVerbEbook
      directives:
        description: Add "optimize pdf (ebook)" to the right-click context menu for PDF files
      settings:
        keyPath: HKCU\Software\Classes\SystemFileAssociations\.pdf\shell\optimize pdf (ebook)
        valueData: "optimize pdf (ebook)"
        valueType: String
    - resource: Microsoft.Windows.Registry/RegistryValue
