---
# CI: Build & Test
#
# Purpose:
#   - Run repository checks: setup, install, test, and build.
#   - Ensure a minimal, reproducible environment for quick CI feedback.
#
# Triggers:
#   - push, pull_request, workflow_dispatch
#
# Security & reproducibility notes:
#   - Use least-privilege permissions (contents: read) and pin action versions where appropriate.
#   - Use local caches to speed builds and reduce external load.

name: "CI: Build & Test"

"on":
  "pull_request":
  "push":
    branches:
      - "**"  # Listen to pushes on all branches
    tags-ignore:
      - "**"  # Ignore tag pushes
  "workflow_dispatch":

# Use concurrency to deduplicate runs.
# - For pull requests: group by `pr-<number>` so multiple commits to the same PR
#   cancel previous runs and only the latest is kept.
# - For direct pushes: fall back to deduplicating by commit SHA so identical
#   commits don't trigger multiple concurrent workflows.
# - Include the `github.workflow` name in the group to avoid cross-workflow collisions.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write  # Needed by magic-nix-cache-action for GHA cache API

jobs:
  build:
    name: "Build & Test (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    env:
      # Keep flake support centralized at the job level so individual commands
      # stay readable while still working on fresh CI environments.
      #
      # WHY the access token: the hermes-agent flake input is fetched from
      # api.github.com, which caps unauthenticated callers at 60 requests per
      # hour per IP. Hosted runners share those IPs and the Nix cache is cold on
      # a new revision, so an unauthenticated fetch intermittently gets a 429 and
      # the job dies during provisioning. GITHUB_TOKEN is always available here
      # and needs read access only, so a read-only fork token is enough.
      #
      # That token covers the api.github.com leg only. The fetch then redirects
      # to codeload.github.com, and neither curl nor Nix forwards Authorization
      # across a cross-host redirect, so the archive arrives unauthenticated and
      # is throttled per IP. The 429 still in the log comes from that second
      # request, cannot be configured away, and costs each job about a minute of
      # retry. Caching the fetcher cache would skip the download, but that is 452
      # MB of upload per lockfile change, a poor trade for a minute.
      NIX_CONFIG: |
        access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
        experimental-features = nix-command flakes
      # Verbose mode: set to 'true' for full step output, or a comma-separated
      # list of step IDs (e.g. 'nix-flake-eval') for targeted debugging.
      # Default: quiet (headers + summaries only).
      NUCLEUS_VERBOSE: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # "warning: unknown setting 'build-provenance-tags'" is expected on every
      # POSIX run and is not a repo defect. nix-installer-action v22 writes that
      # setting to nix.conf whatever `determinate` is set to, and `determinate: false`
      # installs upstream Nix, which has no such setting. Nothing in this repository
      # sets it, and no check step reads it, so the warning is left in the log rather
      # than suppressed.
      # Source: https://github.com/DeterminateSystems/nix-installer-action/pull/236
      - name: Install Nix (POSIX)
        if: runner.os != 'Windows'
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa  # v23
        with:
          determinate: false

      # The FlakeHub 401 and the failure annotation it raises are expected on
      # every run. No FlakeHub account is registered, by choice; the action falls
      # back to the GHA cache, so the job stays green. Accepted deliberately, and
      # not a broken cache.
      - name: Cache Nix store (POSIX)
        if: runner.os != 'Windows'
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7  # v14 # zizmor: ignore[cache-poisoning] intentional Nix store cache on trusted CI runners

      - name: Check Nix flake inputs freshness (POSIX)
        if: runner.os != 'Windows'
        uses: DeterminateSystems/flake-checker-action@786422608c7bded2bbc9741ad9f91356842bf520  # v12.0.0

      - name: Provision bootstrap dependencies (POSIX)
        if: runner.os != 'Windows'
        run: bash scripts/bootstrap.sh --no-apply --no-ai-sync --force-admin

      - name: Provision bootstrap dependencies (Windows)
        if: runner.os == 'Windows'
        run: pwsh -NoLogo -NoProfile -NonInteractive -File scripts/bootstrap.ps1 -ForceAdmin

      - name: Run repository checks (POSIX)
        if: runner.os != 'Windows'
        env:
          PACKER_GITHUB_API_TOKEN: ${{ github.token }}
        # --no-fail-fast: CI should accumulate all failures for visibility.
        run: nix run ${{ env.NUCLEUS_VERBOSE == 'false' && '--quiet' || '' }} ./src#check -- --no-fail-fast ${{ env.NUCLEUS_VERBOSE == 'true' && '--verbose' || (env.NUCLEUS_VERBOSE != 'false' && format('--verbose={0}', env.NUCLEUS_VERBOSE) || '') }}

      - name: Run repository checks (Windows)
        if: runner.os == 'Windows'
        env:
          PACKER_GITHUB_API_TOKEN: ${{ github.token }}
        # --no-fail-fast: CI should accumulate all failures for visibility.
        run: pwsh -NoLogo -NoProfile -NonInteractive -File scripts/check.ps1 --no-fail-fast ${{ env.NUCLEUS_VERBOSE == 'true' && '--verbose' || (env.NUCLEUS_VERBOSE != 'false' && format('--verbose={0}', env.NUCLEUS_VERBOSE) || '') }}

      - name: Run repository tests (POSIX)
        if: runner.os != 'Windows'
        # --no-fail-fast: CI should accumulate all failures for visibility.
        run: nix run ${{ env.NUCLEUS_VERBOSE == 'false' && '--quiet' || '' }} ./src#test -- --no-fail-fast ${{ env.NUCLEUS_VERBOSE == 'true' && '--verbose' || (env.NUCLEUS_VERBOSE != 'false' && format('--verbose={0}', env.NUCLEUS_VERBOSE) || '') }}

      - name: Run repository tests (Windows)
        if: runner.os == 'Windows'
        # --no-fail-fast: CI should accumulate all failures for visibility.
        run: pwsh -NoLogo -NoProfile -NonInteractive -File scripts/test.ps1 --no-fail-fast ${{ env.NUCLEUS_VERBOSE == 'true' && '--verbose' || (env.NUCLEUS_VERBOSE != 'false' && format('--verbose={0}', env.NUCLEUS_VERBOSE) || '') }}
