# CI: Build & Test

name: "CI: Build & Test"

on:
  pull_request:
  push:
    branches:
      - "**" # Listen to pushes on all branches
    tags-ignore:
      - "**" # Ignore tag pushes
  workflow_dispatch:

# Deduplicate runs: per-PR for pull requests, per-commit for pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # Needed by magic-nix-cache-action for GHA cache API

jobs:
  build:
    name: "Build & Test (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    env:
      # Enable Nix flakes.
      NIX_CONFIG: experimental-features = nix-command flakes
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install Nix (POSIX)
        if: runner.os != 'Windows'
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25

      - name: Cache Nix store (POSIX)
        if: runner.os != 'Windows'
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d
        with:
          use-flakehub: false

      - name: Setup Packer CLI (Windows)
        if: runner.os == 'Windows'
        uses: hashicorp/setup-packer@3286471d6cc6756d056a0b199fea5e0becdbc189
        with:
          version: "latest"

      - name: Check Nix flake inputs freshness (POSIX)
        if: runner.os != 'Windows'
        uses: DeterminateSystems/flake-checker-action@89c01715e5d0dfdc0a1bfe9d59891ee4945c1483
        with:
          fail-mode: false

      - name: Run repository checks (POSIX)
        if: runner.os != 'Windows'
        env:
          PACKER_GITHUB_API_TOKEN: ${{ github.token }}
        run: nix run ./src#check

      - name: Run repository checks (Windows)
        if: runner.os == 'Windows'
        env:
          PACKER_GITHUB_API_TOKEN: ${{ github.token }}
        run: pwsh -NoLogo -NoProfile -NonInteractive -File scripts/check.ps1

      - name: Run repository tests (POSIX)
        if: runner.os != 'Windows'
        run: nix run ./src#test

      - name: Run repository tests (Windows)
        if: runner.os == 'Windows'
        run: pwsh -NoLogo -NoProfile -NonInteractive -File scripts/test.ps1
