# CI: Build & Test
#
# Purpose:
#   - Run repository checks: setup, install, test, and build.
#   - Ensure a minimal, reproducible environment for quick CI feedback.
#
# Triggers:
#   - push, pull_request, workflow_dispatch
#
# Security & reproducibility notes:
#   - Use least-privilege permissions (contents: read) and pin action versions where appropriate.
#   - Use local caches to speed builds and reduce external load.

name: "CI: Build & Test"

on:
  pull_request:
  push:
    branches:
      - "**" # Listen to pushes on all branches
    tags-ignore:
      - "**" # Ignore tag pushes
  workflow_dispatch:

# Use concurrency to deduplicate runs.
# - For pull requests: group by `pr-<number>` so multiple commits to the same PR
#   cancel previous runs and only the latest is kept.
# - For direct pushes: fall back to deduplicating by commit SHA so identical
#   commits don't trigger multiple concurrent workflows.
# - Include the `github.workflow` name in the group to avoid cross-workflow collisions.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # Needed by magic-nix-cache-action for GHA cache API

jobs:
  build:
    name: "Build & Test (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    env:
      # Keep flake support centralized at the job level so individual commands
      # stay readable while still working on fresh CI environments.
      NIX_CONFIG: experimental-features = nix-command flakes
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install Nix (POSIX)
        if: runner.os != 'Windows'
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25

      - name: Cache Nix store (POSIX)
        if: runner.os != 'Windows'
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d
        with:
          use-flakehub: false

      - name: Setup Packer CLI (Windows)
        if: runner.os == 'Windows'
        uses: hashicorp/setup-packer@3286471d6cc6756d056a0b199fea5e0becdbc189
        with:
          version: "latest"

      - name: Check Nix flake inputs freshness (POSIX)
        if: runner.os != 'Windows'
        uses: DeterminateSystems/flake-checker-action@89c01715e5d0dfdc0a1bfe9d59891ee4945c1483
        with:
          fail-mode: false

      - name: Check Nix flake evaluation (POSIX)
        if: runner.os != 'Windows'
        run: cd src && nix flake check

      - name: Validate lockfile
        shell: bash
        run: |
          python3 << 'PYEOF'
          import json, sys

          with open('src/lockfiles/lockfile.json') as f:
              lf = json.load(f)

          errors = []

          # Check all version fields for non-empty, non-placeholder values
          for section in ('scoop', 'cargo-binstall', 'bun', 'uv', 'rustup', 'pwsh'):
              if section not in lf or not lf[section]:
                  errors.append(f'{section}: empty or missing')
              else:
                  for pkg, ver in lf[section].items():
                      if not ver or ver == '1.0.0':
                          errors.append(f'{section}.{pkg}: placeholder version ({ver})')

          # winget and vscode may be empty (not yet populated), but warn if absent
          if 'winget' not in lf:
              errors.append('winget: missing section')
          if 'vscode' not in lf:
              errors.append('vscode: missing section')

          # ollama must exist with at least one profile
          if 'ollama' not in lf or not lf['ollama']:
              errors.append('ollama: empty or missing')
          else:
              for profile, models in lf['ollama'].items():
                  if not models:
                      errors.append(f'ollama.{profile}: empty model list')
                  for i, m in enumerate(models):
                      if not m.get('name') or not m.get('tag'):
                          errors.append(f'ollama.{profile}[{i}]: missing name or tag')

          if errors:
              for e in errors:
                  print(f'ERROR: {e}', file=sys.stderr)
              sys.exit(1)

          print('lockfile.json validation passed')
          PYEOF

      - name: Run repository checks (POSIX)
        if: runner.os != 'Windows'
        env:
          PACKER_GITHUB_API_TOKEN: ${{ github.token }}
        run: nix run ./src#check

      - name: Run repository checks (Windows)
        if: runner.os == 'Windows'
        env:
          PACKER_GITHUB_API_TOKEN: ${{ github.token }}
        run: pwsh -NoLogo -NoProfile -NonInteractive -File scripts/check.ps1

      - name: Run repository tests (POSIX)
        if: runner.os != 'Windows'
        run: nix run ./src#test

      - name: Run repository tests (Windows)
        if: runner.os == 'Windows'
        run: pwsh -NoLogo -NoProfile -NonInteractive -File scripts/test.ps1
