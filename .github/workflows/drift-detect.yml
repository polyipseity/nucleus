# Drift Detection (Scheduled)
#
# Purpose:
#   - Periodically check for drift between lockfile.json and the live package
#     registries (winget, scoop, npm, PyPI, etc.).
#   - Runs `check --verify` on a schedule so freshness regressions are caught
#     even without manual intervention.
#
# Trigger:
#   - Scheduled weekly (Sundays 06:00 UTC).
#   - Also supports manual trigger via workflow_dispatch.
#
# This workflow requires network access (it queries package registries) and is
# intentionally separate from CI: CI checks must be reproducible without
# unbounded network calls.

name: "Drift Detection"

on:
  schedule:
    # Every Sunday at 06:00 UTC
    - cron: "0 6 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-drift
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  detect-drift:
    name: "Detect Lockfile Drift (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    env:
      NIX_CONFIG: experimental-features = nix-command flakes
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d
        with:
          use-flakehub: false

      - name: Run bump-lockfile --verify
        run: nix run ./src#bump-lockfile -- --verify

      - name: Run full check --verify
        run: nix run ./src#check -- --verify
