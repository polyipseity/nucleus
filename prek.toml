# Prek native configuration for pre-commit-style hooks.

default_install_hook_types = ["commit-msg", "pre-commit", "pre-push"]
default_stages = ["pre-commit"]

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks.git"
rev = "3e8a8703264a2f4a69428a0aa4dcb512790b2c8c"
# Remove undesired hooks and pin `rev` to explicit commit hashes.
hooks = [
  { id = "check-case-conflict" },
  { id = "check-executables-have-shebangs", exclude = "\\.(bat|cmd|ps1|psd1|psm1|vbs|wsf|wsh)$" },
  { id = "check-illegal-windows-names" },
  { id = "check-merge-conflict" },
  { id = "check-shebang-scripts-are-executable" },
  { id = "check-symlinks" },
  { id = "destroyed-symlinks" },
  { id = "detect-private-key" },
  { id = "end-of-file-fixer" },
  { id = "fix-byte-order-marker" },
  { id = "name-tests-test", args = [
    "--pytest-test-first",
  ] },
  # Preserve markdown hard line breaks (common in docs)
  { id = "trailing-whitespace", args = [
    "--markdown-linebreak-ext=md,mdoc,mdown,mdx,mkd,mkdn,markdown,rmd",
  ] },
]

# Commit message linting via commitlint-pre-commit-hook bridge.
[[repos]]
repo = "https://github.com/alessandrojcm/commitlint-pre-commit-hook.git"
rev = "1f6454da22d006d5bb0d2e65c96c43c23c8a534f"
hooks = [
  { id = "commitlint", stages = [
    "commit-msg",
  ], additional_dependencies = [
    "@commitlint/config-conventional",
  ] },
]

[[repos]]
repo = "https://github.com/python-jsonschema/check-jsonschema.git"
rev = "566da04e213ef56343b4c1eb5a303da9cf1c0a8d"
hooks = [{ id = "check-dependabot" }, { id = "check-github-workflows" }]

[[repos]]
repo = "local"
hooks = [
  # Consolidated check for shell, PowerShell, Packer, and Nix files.
  { id = "repo-check", name = "repository checks", language = "python", files = "(\\.hcl|\\.nix|\\.pkr|\\.ps1|\\.sh)$", entry = "python scripts/prek-hooks.py check", args = [
    "--format",
  ] },
  # Repository test suite — runs Nix test suite evaluation (tests/src/*.nix).
  # Always runs on pre-push regardless of changed files.
  { id = "repo-test", name = "repository tests", language = "python", always_run = true, stages = [
    "pre-push",
  ], entry = "python scripts/prek-hooks.py test" },
]
